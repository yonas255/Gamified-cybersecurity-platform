{% extends "base.html" %}

{% block title %}Login{% endblock %}
{% block header %}Login{% endblock %}
{% block subheader %}Access your account to start challenges{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm glass-card">
            <div class="card-body">

                <form method="POST" class="d-grid gap-2">
                    <label class="form-label fw-semibold text-white">Email</label>
                    <input class="form-control" name="email" type="email" placeholder="Email" required />

                    <label class="form-label mt-2 fw-semibold text-white">Password</label>
                    <input class="form-control" name="password" type="password" placeholder="Password" required />

                    <button class="btn btn-dark mt-3" type="submit">Login</button>
                </form>

                <p class="mt-3 mb-0 text-center text-white">
                    <span class="">
                    No account?</span> <a href="/register"class="fw-bold text-Red text-decoration-underline">Register</a>
                </p>

            </div>
        </div>
    </div>
</div>


{% endblock %}
