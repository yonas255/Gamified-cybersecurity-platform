{% extends "base.html" %}

{% block title %}2FA Verification{% endblock %}
{% block header %}Two-Factor Authentication{% endblock %}
{% block subheader %}Enter the 6-digit code from your app{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <input class="form-control mb-2" name="code" placeholder="123456" required>
                    <button class="btn btn-dark w-100">Verify</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
